server:
  port: 8083

spring:
  application:
    name: order-job

  # Quartz configuration
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 5

  # JPA / H2 configuration
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # MongoDB configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/order_events_db
      auto-index-creation: true

  # Kafka configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-N/A}] %-5level %logger{36} - %msg%n"
  level:
    com.core: DEBUG
